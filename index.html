    function generateDatePrefixes(monthCode, dayNumStr, customCode = "") {
      let dayPadded = dayNumStr.padStart(2, '0');
      let daySingle = String(parseInt(dayNumStr, 10));
      let prefixes = [];

      if (customCode) {
        prefixes.push(`26${customCode}${dayPadded}`);
        prefixes.push(`26${customCode}${daySingle}`);
      } else {
        let dayFormatted = dayPadded;
        prefixes.push(`26${monthCode}${dayFormatted}`);
        
        if (monthCode === "OCT") prefixes.push(`26O${dayFormatted}`);
        if (monthCode === "SEP") prefixes.push(`26S${dayFormatted}`);
        
        const monthShortMap = { "JAN":"JA", "FEB":"FE", "MAR":"MR", "APR":"AP", "MAY":"MY", "JUN":"JN", "JUL":"JL", "AUG":"AG", "SEP":"S", "OCT":"O", "NOV":"NV", "DEC":"DC" };
        let shortCode = monthShortMap[monthCode];
        if (shortCode) prefixes.push(`26${shortCode}${dayFormatted}`);
      }
      return [...new Set(prefixes)];
    }

    function generateSmartVariants(inputVal, category) {
      let raw = inputVal.replace(/\s+/g, '');
      let variants = new Set();

      if (category === 'TOPUP') {
        let cleanCap = raw.charAt(0).toUpperCase() + raw.slice(1);
        let cleanUpper = raw.toUpperCase();
        let cleanLower = raw.toLowerCase();

        variants.add(`${cleanCap}TopUp`);
        variants.add(`${cleanCap}Topup`);
        variants.add(`${cleanUpper}TopUp`);
        variants.add(`${cleanUpper}TOPUP`);
        variants.add(`${cleanLower}topup`);
        variants.add(cleanCap);
        variants.add(cleanUpper);
      } else {
        variants.add(raw.charAt(0).toUpperCase() + raw.slice(1));
        variants.add(raw.toUpperCase());
      }

      return Array.from(variants);
    }

                      testQueue.push({
                        url: `${BASE_ENDPOINT}${pfx}_${keyword}_${finalWord}_DoubleWheelBG_${activeReg}_en.png`,
                        name: `${pfx}_${keyword}_${finalWord}_DoubleWheelBG_${activeReg}_en.png`,
                        tag: "DOUBLE WHEEL BG"
                      });
                    }
                  });
                });
              });
            });
          });
        });
      }

      testQueue = testQueue.filter((v, i, a) => a.findIndex(t => t.url === v.url) === i);

      let totalRequests = testQueue.length;
      let processed = 0;
      let concurrencyLimit = 50;
      let index = 0;

      document.getElementById('pFill').style.width = '0%';
      document.getElementById('percentText').innerText = '0%';
      document.getElementById('extractCount').innerText = `UNLOCKED: 0`;

      async function checkWorker() {
        while (index < totalRequests) {
          if (currentScanSession !== thisSession || forceBreakScanner) return;

          let currentIndex = index++;
          let item = testQueue[currentIndex];
          if (!item) break;

          const exists = await new Promise(r => {
            const img = new Image();
            img.onload = () => r(true);
            img.onerror = () => r(false);
            img.src = item.url;
          });

          if (currentScanSession !== thisSession || forceBreakScanner) return;
          processed++;

          let pct = Math.round((processed / totalRequests) * 100);
          document.getElementById('pFill').style.width = pct + '%';
          document.getElementById('percentText').innerText = pct + '%';
          document.getElementById('statusText').innerHTML = `Scanning: ${processed}/${totalRequests}...`;

          if (exists) {
            if (currentScanSession !== thisSession) return;

            if (discoveredUniqueNames.has(item.name)) continue;
            discoveredUniqueNames.add(item.name);

            foundAssets++;
            playSuccessSound();
            injectCard(sgGrid, item.url, item.name, item.tag);
            document.getElementById('extractCount').innerText = `UNLOCKED: ${foundAssets}`;
            sendSingleAssetToTelegram(inputFieldVal, currentMode.toUpperCase(), currentSelectedCategory.toUpperCase(), item.url, item.name);

            if (item.type === 'GLOBAL_TAB') {
              await triggerSmartSecondaryAssetsScan(item, sgGrid, inputFieldVal, currentMode.toUpperCase(), currentSelectedCategory.toUpperCase(), thisSession);
            }
          }
        }
      }

      let workers = [];
      for (let w = 0; w < Math.min(concurrencyLimit, totalRequests); w++) workers.push(checkWorker());
      await Promise.all(workers);

      if (currentScanSession === thisSession && !forceBreakScanner) {
        document.getElementById('statusText').innerHTML = foundAssets > 0
          ? `<span class="text-purple-300 font-bold">Extraction Complete • ${foundAssets} Assets Found</span>`
          : `<span class="text-slate-400 font-bold">No Records Found</span>`;
        saveSearchLog(inputFieldVal, foundAssets);
      }
    }

    async function triggerSmartSecondaryAssetsScan(tabItem, gridElement, originalKeyword, server, category, sessionToken) {
      let regTargets = [...new Set([tabItem.activeReg || 'SG', 'SG'])];
      for (let activeReg of regTargets) {
        let secondaries = [
          { suffix: `_Poster_${activeReg}_en.png`, label: "POSTER" },
          { suffix: `_Title_${activeReg}_en.png`, label: "TITLE" },
          { suffix: `_LobbyBG_${activeReg}_en.jpg`, label: "LOBBY BG" },
          { suffix: `_WheelBG_${activeReg}_en.png`, label: "WHEEL BG" },
          { suffix: `_DoubleWheelBG_${activeReg}_en.png`, label: "DOUBLE WHEEL BG" }
        ];
        for (let s of secondaries) {
          if (currentScanSession !== sessionToken || forceBreakScanner) break;
          let url = `${tabItem.baseDomain}${tabItem.prefix}_${tabItem.keyword}_${tabItem.word}${s.suffix}`;
          let name = `${tabItem.prefix}_${tabItem.keyword}_${tabItem.word}${s.suffix}`;
          let exists = await new Promise(r => { const img = new Image(); img.onload = () => r(true); img.onerror = () => r(false); img.src = url; });
          
          if (currentScanSession !== sessionToken || forceBreakScanner) break;
          if (exists) {
            injectCard(gridElement, url, name, s.label);
            sendSingleAssetToTelegram(originalKeyword, server, category, url, name);
          }
        }
      }
    }

    function handleImgError(element) {
      element.onerror = null;
      element.parentNode.innerHTML = `<div class="w-full h-24 sm:h-28 bg-black/60 flex items-center justify-center p-2 rounded-xl border border-white/5"><span class="text-[9px] font-mono text-slate-500 uppercase tracking-widest text-center">ASSET VERIFIED</span></div>`;
    }

    function injectCard(gridElement, url, name, tagText) {
      let colorMap = {
        "TOPUP DIRECT": "bg-purple-600 text-white font-black",
        "TOPUP EXTRA": "bg-indigo-600 text-white font-black",
        "TOPUP SPLASH": "bg-amber-600 text-white font-black",
        "TOPUP BANNER": "bg-emerald-600 text-white font-black",
        "TOPUP TILE": "bg-blue-600 text-white font-black"
      };
      let badgeClass = colorMap[tagText] || "bg-black/85 border border-purple-500/40 text-purple-300";

      gridElement.insertAdjacentHTML('beforeend', `
        <div class="asset-specimen rounded-2xl p-2 flex flex-col justify-between shadow-lg">
          <div onclick="openImagePreview('${url}', '${name}')" class="relative overflow-hidden rounded-xl bg-slate-950 mb-2 cursor-pointer group border border-white/10 h-28 sm:h-32 w-full flex items-center justify-center">
            <img src="${url}" class="absolute inset-0 w-full h-full object-cover blur-lg opacity-40 scale-125 pointer-events-none" onerror="this.style.display='none'" />
            <div class="absolute inset-0 bg-black/25 pointer-events-none"></div>
            <img src="${url}" class="relative z-10 max-w-full max-h-full object-contain transition-transform duration-300 group-hover:scale-105 p-1" onerror="handleImgError(this)" />
            <span class="absolute bottom-1.5 left-1.5 ${badgeClass} text-[7px] font-mono px-1.5 py-0.5 rounded tracking-wider uppercase pointer-events-none shadow-lg z-20">${tagText}</span>
          </div>
          <div class="text-[8px] font-mono text-slate-300 truncate mb-2 px-0.5" title="${name}">${name}</div>
          <div class="flex gap-1">
            <button onclick="openImagePreview('${url}', '${name}')" class="flex-1 bg-white/[0.05] hover:bg-purple-600 text-white py-1.5 rounded-lg transition border border-white/5 font-mono text-[8px] uppercase tracking-wide font-black">VIEW</button>
            <button onclick="copyToClipboard('${url}', this)" class="flex-1 bg-black/60 border border-white/10 hover:border-purple-400 text-slate-300 hover:text-white py-1.5 rounded-lg transition font-mono text-[8px] uppercase tracking-wide">COPY</button>
          </div>
        </div>
      `);
    }

    function openImagePreview(url, name) {
      document.getElementById('lightboxImage').src = url;
      document.getElementById('lightboxTitle').innerText = name;
      document.getElementById('lightboxDownloadBtn').href = url;
      document.getElementById('lightboxCopyBtn').setAttribute('data-url', url);
      document.getElementById('lightboxCopyBtn').innerText = "COPY LINK";
      document.getElementById('imageLightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeImagePreview() {
      document.getElementById('imageLightbox').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btnElement.innerText;
        btnElement.innerText = "COPIED";
        setTimeout(() => { btnElement.innerText = oldText; }, 1200);
      }).catch(() => { alert("Failed to copy link."); });
    }

    function saveSearchLog(keyword, foundCount) {
      let history = JSON.parse(localStorage.getItem('ff_phantom_logs') || "[]");
      history.unshift({
        keyword: keyword || "ALL",
        server: currentMode.toUpperCase(),
        found: foundCount,
        time: new Date().toLocaleTimeString()
      });
      if (history.length > 25) history.pop();
      localStorage.setItem('ff_phantom_logs', JSON.stringify(history));
      renderHistoryLogs();
    }

    function renderHistoryLogs() {
      const container = document.getElementById('historyLogsContainer');
      let history = JSON.parse(localStorage.getItem('ff_phantom_logs') || "[]");
      if (!history.length) {
        container.innerHTML = `<div class="text-slate-600 text-center py-2 font-mono">No scans executed yet.</div>`;
        return;
      }
      container.innerHTML = history.map(log => `
        <div class="flex items-center justify-between border-b border-white/[0.04] pb-1 pt-0.5 font-mono">
          <div class="flex items-center gap-1.5 truncate">
            <span class="text-purple-400 font-bold">[${log.server}]</span>
            <span class="text-slate-200 truncate" title="${log.keyword}">${log.keyword}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-slate-500">${log.time}</span>
            <span class="font-bold ${log.found > 0 ? 'text-purple-400' : 'text-slate-500'}">(${log.found})</span>
          </div>
        </div>
      `).join('');
    }

    function clearSearchHistory() {
      localStorage.setItem('ff_phantom_logs', '[]');
      renderHistoryLogs();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('button, a, select').forEach(el => el.addEventListener('click', playClick));
      updateNetworkStatus();
      renderHistoryLogs();
    });
  </script>
</body>
</html>
